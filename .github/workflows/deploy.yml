# Deploy automático a Firebase Hosting (https://kamae-ar.web.app) en cada push a main.
# Si fallan el lint o los tests de reglas, NO se publica.
# Las reglas de Firestore NO se despliegan acá: tras cambiar firestore.rules, correr
#   npx firebase deploy --only firestore:rules   (desde kamae-catalog/)
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'kamae-catalog/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # botón "Run workflow" en GitHub para desplegar a mano

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kamae-catalog
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kamae-catalog/package-lock.json

      # El emulador de Firestore (tests de reglas) necesita Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run lint
      - run: npm run test:rules
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAMAE_AR }}
          projectId: kamae-ar
          channelId: live
          entryPoint: kamae-catalog
